name: Verify and publish Home Assistant backup image

on:
  pull_request:
    paths:
      - home-assistant/backup/**
      - .github/workflows/home-assistant-backup-image.yaml
  push:
    branches: [main]
    paths:
      - home-assistant/backup/**
      - .github/workflows/home-assistant-backup-image.yaml
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/k8s-homelab-home-assistant-backup

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck home-assistant/backup/*.sh
      - name: Backup contract
        run: home-assistant/backup/test-backup.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: home-assistant/backup
          push: false
          tags: homelab/home-assistant-backup:verify

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: home-assistant/backup
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          sbom: true
          provenance: mode=max
