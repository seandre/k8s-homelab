apiVersion: batch/v1
kind: CronJob
metadata:
  name: home-assistant-pbs-backup
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant-backup
spec:
  schedule: "0 3 * * *"
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: home-assistant-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pbs-client
              image: ghcr.io/seandre/k8s-homelab-home-assistant-backup:sha-26d8435e8b2f2b40466548c3ad0db4d2d38e3676@sha256:ac977ee392a896827f15ab4a8db3c73fc773644e235c34678038a026239363d4
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: config
                  mountPath: /source
                  readOnly: true
                - name: credentials
                  mountPath: /credentials
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: config
              persistentVolumeClaim:
                claimName: home-assistant-config
            - name: credentials
              secret:
                secretName: home-assistant-pbs-backup
            - name: tmp
              emptyDir: {}
