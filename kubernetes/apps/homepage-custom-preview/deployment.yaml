apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage-custom-preview
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage-custom
    app.kubernetes.io/instance: preview
    app.kubernetes.io/component: dashboard
spec:
  # A single gateway owns the RWO idempotency journal and per-target execution
  # locks. Availability is restored by the Deployment after failure.
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage-custom
      app.kubernetes.io/instance: preview
  template:
    metadata:
      annotations:
        homelab.seandre.dev/runtime-secret-revision: "airgradient-control-v1"
      labels:
        app.kubernetes.io/name: homepage-custom
        app.kubernetes.io/instance: preview
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: homepage-custom-k3s-reader
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: homepage-custom
              app.kubernetes.io/instance: preview
      containers:
        - name: homepage
          image: ghcr.io/seandre/k8s-homelab-homepage:sha-4b332b9@sha256:83b27656b6ce4b7fb5060d6f5c5a4e289e8fea79413575466f02dab98fac38f3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: HOMEPAGE_RUNTIME_MODE
              value: production
            - name: LIVE_TELEMETRY
              value: "true"
            - name: AIRNOW_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-airnow-readonly
                  key: api-key
                  optional: true
            - name: WEATHERAPI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-weatherapi-readonly
                  key: api-key
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: preview-runtime-config
              mountPath: /etc/homepage-preview
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: argocd-credentials
              mountPath: /var/run/homepage-secrets/argocd
              readOnly: true
            - name: pve01-credentials
              mountPath: /var/run/homepage-secrets/pve01
              readOnly: true
            - name: pve02-credentials
              mountPath: /var/run/homepage-secrets/pve02
              readOnly: true
            - name: pbs-credentials
              mountPath: /var/run/homepage-secrets/pbs
              readOnly: true
            - name: unifi-credentials
              mountPath: /var/run/homepage-secrets/unifi
              readOnly: true
            - name: home-assistant-credentials
              mountPath: /var/run/homepage-secrets/home-assistant
              readOnly: true
            - name: home-assistant-control-map
              mountPath: /var/run/homepage-secrets/home-assistant-control
              readOnly: true
            - name: home-assistant-control-token
              mountPath: /var/run/homepage-secrets/home-assistant-control-token
              readOnly: true
            - name: action-state
              mountPath: /var/lib/homepage
      volumes:
        - name: preview-runtime-config
          configMap:
            name: homepage-custom-preview
        - name: tmp
          emptyDir:
            medium: Memory
        # Optional while all live adapters remain disabled. Enabling an adapter
        # later makes its corresponding Secret required by that adapter only.
        - name: argocd-credentials
          secret:
            secretName: homepage-argocd-readonly
            optional: true
        - name: pve01-credentials
          secret:
            secretName: homepage-proxmox-pve01
            optional: true
        - name: pve02-credentials
          secret:
            secretName: homepage-proxmox-pve02
            optional: true
        - name: pbs-credentials
          secret:
            secretName: homepage-pbs-readonly
            optional: true
        - name: unifi-credentials
          secret:
            secretName: homepage-unifi-readonly
            optional: true
        - name: home-assistant-credentials
          secret:
            secretName: homepage-home-assistant-readonly
            optional: true
        # Runtime-only private entity mappings. Values are deliberately absent
        # from Git and the public bootstrap/action contracts.
        - name: home-assistant-control-map
          secret:
            secretName: homepage-home-assistant-control
            optional: true
        - name: home-assistant-control-token
          secret:
            secretName: homepage-home-assistant-control-token
            optional: true
        - name: action-state
          persistentVolumeClaim:
            claimName: homepage-indoor-actions
