apiVersion: apps/v1
kind: Deployment
metadata:
  name: cycling-calendar
  namespace: cycling-calendar
  labels:
    app.kubernetes.io/name: cycling-calendar
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cycling-calendar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cycling-calendar
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: calendar
          # CI replaces this bootstrap reference with image@sha256:<digest>.
          image: ghcr.io/seandre/womens-road-calendar@sha256:1c5a81047e2c378fe768cfc33b51cecaefeecf389e139297cd3d396f9720f157
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: nginx-runtime
              mountPath: /tmp
      volumes:
        - name: nginx-runtime
          emptyDir: {}
