apiVersion: v1
kind: Namespace
metadata:
  name: homepage-observability
  labels:
    app.kubernetes.io/name: homepage-k3s-reader
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage-k3s-reader
  namespace: homepage-observability
  labels:
    app.kubernetes.io/name: homepage-k3s-reader
---
# Intentionally long-lived for the cross-cluster k3s consumer. Rotate every
# 90 days using the overlap procedure in the operations runbook.
apiVersion: v1
kind: Secret
metadata:
  name: homepage-k3s-reader-token
  namespace: homepage-observability
  annotations:
    kubernetes.io/service-account.name: homepage-k3s-reader
  labels:
    app.kubernetes.io/name: homepage-k3s-reader
type: kubernetes.io/service-account-token
