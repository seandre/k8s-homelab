# Dynamic integration discovery keeps private Coway and AirGradient entity IDs
# out of Git. The integrations expose two Coway fans, two Coway Light selects,
# and two AirGradient brightness numbers.
automation:
  - id: coway_night_mode_start
    alias: Coways - night mode start
    mode: single
    trigger:
      - platform: time
        at: "22:00:00"
      - platform: homeassistant
        event: start
    condition:
      - condition: template
        value_template: >-
          {{ now().strftime('%H:%M:%S') >= '22:00:00' or
             now().strftime('%H:%M:%S') < '06:30:00' }}
    variables:
      coway_fans: >-
        {{ integration_entities('coway') | select('match', '^fan\.') | list }}
      coway_aqi_lights: >-
        {% set ns = namespace(entities=[]) %}
        {% for entity in integration_entities('coway') | select('match', '^select\.') %}
          {% if 'AQI Off' in (state_attr(entity, 'options') | default([], true)) %}
            {% set ns.entities = ns.entities + [entity] %}
          {% endif %}
        {% endfor %}
        {{ ns.entities }}
      airgradient_brightness_numbers: >-
        {% set ns = namespace(entities=[]) %}
        {% for entity in integration_entities('airgradient') | select('match', '^number\.') %}
          {% if 'brightness' in (state_attr(entity, 'friendly_name') | default('', true) | lower) %}
            {% set ns.entities = ns.entities + [entity] %}
          {% endif %}
        {% endfor %}
        {{ ns.entities }}
    action:
      - if:
          - condition: template
            value_template: "{{ airgradient_brightness_numbers | count == 2 }}"
        then:
          - service: number.set_value
            continue_on_error: true
            target:
              entity_id: "{{ airgradient_brightness_numbers }}"
            data:
              value: 5
      - condition: template
        value_template: "{{ coway_fans | count == 2 and coway_aqi_lights | count == 2 }}"
      - service: fan.turn_on
        target:
          entity_id: "{{ coway_fans }}"
      - service: fan.set_percentage
        target:
          entity_id: "{{ coway_fans }}"
        data:
          percentage: 66
      - service: select.select_option
        target:
          entity_id: "{{ coway_aqi_lights }}"
        data:
          option: "Off"
  # Reconcile overnight drift without sending commands to healthy devices.
  # A periodic check also retries failed commands and devices that reconnect.
  - id: coway_night_level_2_guard
    alias: Coways - keep level 2 overnight
    mode: single
    max_exceeded: silent
    trigger:
      - platform: time_pattern
        minutes: "/1"
    condition:
      - condition: template
        value_template: >-
          {{ now().strftime('%H:%M:%S') >= '22:00:00' or
             now().strftime('%H:%M:%S') < '06:30:00' }}
    action:
      - repeat:
          for_each: >-
            {{ integration_entities('coway') | select('match', '^fan\.') | list }}
          sequence:
            - if:
                - condition: template
                  value_template: >-
                    {{ (now().strftime('%H:%M:%S') >= '22:00:00' or
                        now().strftime('%H:%M:%S') < '06:30:00') and
                       states(repeat.item) not in ['unknown', 'unavailable'] and
                       (not is_state(repeat.item, 'on') or
                        state_attr(repeat.item, 'percentage') != 66 or
                        state_attr(repeat.item, 'preset_mode') not in [none, '']) }}
              then:
                # Coway set_percentage also powers on an off purifier.
                - service: fan.set_percentage
                  continue_on_error: true
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    percentage: 66
      # Power-on can restore the lights, so reconcile lights after fan recovery.
      - repeat:
          for_each: >-
            {% set ns = namespace(entities=[]) %}
            {% for entity in integration_entities('coway') | select('match', '^select\.') %}
              {% if 'AQI Off' in (state_attr(entity, 'options') | default([], true)) %}
                {% set ns.entities = ns.entities + [entity] %}
              {% endif %}
            {% endfor %}
            {{ ns.entities }}
          sequence:
            - if:
                - condition: template
                  value_template: >-
                    {{ (now().strftime('%H:%M:%S') >= '22:00:00' or
                        now().strftime('%H:%M:%S') < '06:30:00') and
                       states(repeat.item) not in ['unknown', 'unavailable', 'Off'] }}
              then:
                - service: select.select_option
                  continue_on_error: true
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    option: "Off"
  - id: coway_night_mode_end
    alias: Coways - night mode end
    mode: single
    trigger:
      - platform: time
        at: "06:30:00"
    variables:
      coway_fans: >-
        {{ integration_entities('coway') | select('match', '^fan\.') | list }}
      coway_aqi_lights: >-
        {% set ns = namespace(entities=[]) %}
        {% for entity in integration_entities('coway') | select('match', '^select\.') %}
          {% if 'AQI Off' in (state_attr(entity, 'options') | default([], true)) %}
            {% set ns.entities = ns.entities + [entity] %}
          {% endif %}
        {% endfor %}
        {{ ns.entities }}
    action:
      - condition: template
        value_template: "{{ coway_fans | count == 2 and coway_aqi_lights | count == 2 }}"
      - service: fan.set_preset_mode
        target:
          entity_id: "{{ coway_fans }}"
        data:
          preset_mode: "Auto"
      - service: select.select_option
        target:
          entity_id: "{{ coway_aqi_lights }}"
        data:
          option: "On"

  - id: airgradient_day_brightness_restore
    alias: AirGradient - day brightness restore
    mode: single
    trigger:
      - platform: time
        at: "07:00:00"
      - platform: homeassistant
        event: start
    condition:
      - condition: template
        value_template: >-
          {{ now().strftime('%H:%M:%S') >= '07:00:00' and
             now().strftime('%H:%M:%S') < '22:00:00' }}
    variables:
      airgradient_brightness_numbers: >-
        {% set ns = namespace(entities=[]) %}
        {% for entity in integration_entities('airgradient') | select('match', '^number\.') %}
          {% if 'brightness' in (state_attr(entity, 'friendly_name') | default('', true) | lower) %}
            {% set ns.entities = ns.entities + [entity] %}
          {% endif %}
        {% endfor %}
        {{ ns.entities }}
    action:
      - condition: template
        value_template: "{{ airgradient_brightness_numbers | count == 2 }}"
      - service: number.set_value
        target:
          entity_id: "{{ airgradient_brightness_numbers }}"
        data:
          value: 80
